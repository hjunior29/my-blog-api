[package]
name = "my-blog-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# Keep bundled SQLite on a release with the WAL-reset fix.
libsqlite3-sys = { version = "0.37", default-features = false }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
serde_json = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
